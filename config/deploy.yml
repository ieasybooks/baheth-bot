service: baheth-bot

image: ieasybooks/baheth-bot

registry:
  username: ieasybooks

  password:
    - KAMAL_REGISTRY_PASSWORD

# ieasy-books-vm, a GCP VM shared with baheth and makhzan. Kamal reaches its
# SSH port through an IAP tunnel, so deploys need a gcloud login that may open
# one (the Deploy workflow signs in as kamal-deploy) and ubuntu's key.
servers:
  web:
    hosts:
      - ieasy-books-vm
    # The bot polls Telegram and serves nothing, so it has no proxy route.
    proxy: false

env:
  secret:
    - TELEGRAM_BOT_TOKEN
    - ADMIN_USER_IDS

    - BAHETH_API_BASE_URL
    - MEDIA_ENDPOINT
    - TRANSCRIPTIONS_SEARCH_ENDPOINT
    - HADITHS_SEARCH_ENDPOINT
    - SHAMELA_SEMANTIC_SEARCH_ENDPOINT
    - BAHETH_API_TOKEN

    - TURATH_API_BASE_URL
    - SHAMELA_CLASSICAL_SEARCH_ENDPOINT

ssh:
  user: ubuntu
  proxy_command: gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone europe-west1-b --project earnest-reactor-514916-n4

# The VM is ARM, and so is the Deploy workflow's runner, so the image is built
# there.
builder:
  arch: arm64
